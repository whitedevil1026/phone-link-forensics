name: tests
on: [push, pull_request]
jobs:
  test:
    # Phone Link and the artifacts this tool reads exist only on Windows, so the tests run on Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pyyaml yamllint
      - name: yamllint (upstream SQLECmd rules)
        run: yamllint -c .yamllint maps
      - name: Upstream maps for the cross-match test
        run: git clone --depth 1 https://github.com/EricZimmerman/SQLECmd.git upstream
      - name: Synthetic answer-key tests
        run: python tests/run_tests.py --upstream-maps upstream/SQLMap/Maps
      - name: Viewer relation tests
        run: python viewer/test_plrelate.py
      - name: Evidence integrity and carving tests
        run: python viewer/test_plevidence.py
      - name: Linked-phones tests
        run: python viewer/test_pldevices.py
      - name: Cable / Bluetooth connection tests
        run: python viewer/test_plconnect.py
      - name: Viewer GUI tests (Windows desktop)
        run: python viewer/test_plmapview.py
